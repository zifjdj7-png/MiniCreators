<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord HTML блок</title>
  <style>
    :root {
      --bg: #1e1f22;
      --panel: #2b2d31;
      --panel-soft: #313338;
      --text: #f2f3f5;
      --muted: #b5bac1;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --ok: #3ba55c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #2f3136 0%, var(--bg) 55%);
      color: var(--text);
      font: 16px/1.4 "Segoe UI", Inter, Roboto, Arial, sans-serif;
      padding: 24px;
    }

    .discord-card {
      width: min(100%, 420px);
      background: var(--panel);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .banner {
      height: 130px;
      background: linear-gradient(135deg, #5865f2, #7c84ff);
      position: relative;
    }

    .avatar {
      position: absolute;
      bottom: -28px;
      left: 20px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid var(--panel);
      background: #fff url("https://cdn-icons-png.flaticon.com/512/2111/2111370.png") center/60% no-repeat;
    }

    .content {
      padding: 44px 20px 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .tag {
      color: var(--muted);
      margin-top: 2px;
      font-size: 0.95rem;
    }

    .status {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-soft);
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(59, 165, 92, 0.2);
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-hover);
    }

    .btn-ghost {
      background: var(--panel-soft);
      color: var(--text);
    }

    .btn-ghost:hover {
      filter: brightness(1.1);
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <article class="discord-card">
    <header class="banner">
      <div class="avatar" aria-label="Discord avatar"></div>
    </header>

    <section class="content">
      <h1>MiniCreators Community</h1>
      <div class="tag">@minicreators</div>

      <div class="status">
        <span class="dot"></span>
        Онлайн • 124 участника сейчас
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="https://discord.com" target="_blank" rel="noopener noreferrer">Открыть Discord</a>
        <button class="btn btn-ghost" id="copyTag">Скопировать тег</button>
      </div>

      <p class="hint" id="hint">Нажми кнопку, чтобы скопировать @minicreators</p>
    </section>
  </article>

  <script>
    const copyButton = document.getElementById('copyTag');
    const hint = document.getElementById('hint');

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('@minicreators');
        hint.textContent = 'Тег скопирован ✅';
      } catch {
        hint.textContent = 'Не удалось скопировать (проверь разрешения браузера).';
      }
    });
  </script>
</body>
</html>
